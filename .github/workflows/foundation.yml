name: Portable verification

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_foundation.py
      - run: bash scripts/test_rules.sh
      - run: python3 scripts/ue_mac_test.py
      - run: python3 scripts/ue_perf_test.py
